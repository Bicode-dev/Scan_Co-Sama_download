<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-sama - Lecteur de Scan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1d3a 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: rgba(10, 14, 39, 0.95);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #2a3f5f;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .download-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
            z-index: 101;
        }

        .download-btn:hover {
            background: #2563eb;
        }

        .controls {
            background: rgba(20, 24, 49, 0.9);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            border: 1px solid #2a3f5f;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        label {
            font-weight: bold;
            min-width: 150px;
        }

        select, input[type="file"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #2a3f5f;
            background: #1a1d3a;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }

        select {
            min-width: 200px;
        }

        input[type="file"] {
            display: none;
        }

        .file-button {
            padding: 10px 20px;
            background: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .file-button:hover {
            background: #2563eb;
        }

        .background-options {
            display: flex;
            gap: 10px;
        }

        .bg-option {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .bg-option.active {
            border-color: #3b82f6;
        }

        .bg-option.cyan { background: #06b6d4; }
        .bg-option.white { background: #fff; }
        .bg-option.dark { background: #1a1d3a; }

        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .nav-btn {
            padding: 12px 24px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
        }

        .fullscreen-btn {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(59, 130, 246, 0.9);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            z-index: 101;
        }

        .reader-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .page-image {
            max-width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .no-content {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2em;
            color: #9ca3af;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .control-row {
                flex-direction: column;
                align-items: flex-start;
            }

            label {
                min-width: auto;
            }

            .nav-buttons {
                flex-direction: column;
                width: 100%;
            }

            .nav-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌙 Co-sama - Lecteur de Scan 🌙</h1>
    </div>

    <button class="download-btn" onclick="handleDownload()">📥 Télécharger</button>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Plein écran</button>

    <div class="controls">
        <div class="control-row">
            <label>CHAPITRE :</label>
            <select id="chapterSelect" onchange="loadChapter()">
                <option value="">Sélectionner un chapitre</option>
            </select>
        </div>

        <div class="control-row">
            <label>DERNIÈRE SÉLECTION :</label>
            <span id="lastSelection">Aucun</span>
        </div>

        <div class="control-row">
            <label>ARRIÈRE-PLAN :</label>
            <div class="background-options">
                <div class="bg-option cyan active" onclick="changeBackground('#06b6d4', this)"></div>
                <div class="bg-option white" onclick="changeBackground('#ffffff', this)"></div>
                <div class="bg-option dark" onclick="changeBackground('#1a1d3a', this)"></div>
            </div>
        </div>

        <div class="control-row">
            <label>IMPORTER DOSSIER :</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple onchange="loadFolder()">
            <button class="file-button" onclick="document.getElementById('folderInput').click()">
                📁 Choisir un dossier
            </button>
        </div>

        <div class="control-row nav-buttons">
            <button class="nav-btn" id="prevBtn" onclick="previousChapter()" disabled>
                ◀ Chapitre précédent
            </button>
            <button class="nav-btn" id="nextBtn" onclick="nextChapter()" disabled>
                Chapitre suivant ▶
            </button>
        </div>
    </div>

    <div class="reader-container">
        <div id="pagesContainer" class="pages-container">
            <div class="no-content">
                📚 Importez un dossier de manga pour commencer la lecture
            </div>
        </div>
    </div>

    <script>
        let chapters = {};
        let currentChapter = null;
        let mangaName = '';

        function handleDownload() {
            const userAgent = navigator.userAgent.toLowerCase();
            let downloadUrl;

            if (/android/.test(userAgent)) {
                downloadUrl = 'https://play.google.com/store'; // Lien pour Android
            } else if (/win/.test(userAgent)) {
                downloadUrl = 'https://www.microsoft.com/store'; // Lien pour Windows
            } else {
                downloadUrl = '#'; // Lien par défaut si la plateforme n'est pas détectée
                alert('Plateforme non reconnue. Veuillez visiter le site approprié.');
            }

            window.open(downloadUrl, '_blank');
        }

        function loadFolder() {
            const input = document.getElementById('folderInput');
            const files = Array.from(input.files);
            
            if (files.length === 0) return;

            chapters = {};
            const chapterSelect = document.getElementById('chapterSelect');
            chapterSelect.innerHTML = '<option value="">Sélectionner un chapitre</option>';

            // Détecter la structure du dossier
            let rootFolders = new Set();
            files.forEach(file => {
                const pathParts = file.webkitRelativePath.split('/');
                if (pathParts.length >= 2) {
                    rootFolders.add(pathParts[0]);
                }
            });

            let isNestedManga = rootFolders.size === 1;
            let mangaRootLevel = 0;
            if (isNestedManga) {
                mangaName = Array.from(rootFolders)[0];
                mangaRootLevel = 1;
            } else {
                mangaName = 'manga';
                mangaRootLevel = 0;
            }

            // Organiser les fichiers par chapitre
            files.forEach(file => {
                const pathParts = file.webkitRelativePath.split('/');
                
                if (pathParts.length >= 2 + mangaRootLevel) {
                    const chapterFolder = pathParts[mangaRootLevel];
                    const fileName = pathParts[pathParts.length - 1];
                    
                    // Ne garder que les images
                    if (fileName.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        if (!chapters[chapterFolder]) {
                            chapters[chapterFolder] = [];
                        }
                        chapters[chapterFolder].push(file);
                    }
                }
            });

            // Trier les chapitres
            const sortedChapters = Object.keys(chapters).sort((a, b) => {
                const numA = parseInt(a.match(/\d+/)?.[0] || '0');
                const numB = parseInt(b.match(/\d+/)?.[0] || '0');
                return numA - numB;
            });

            // Remplir le select
            sortedChapters.forEach(chapter => {
                // Trier les pages du chapitre
                chapters[chapter].sort((a, b) => {
                    const numA = parseInt(a.name.match(/\d+/)?.[0] || '0');
                    const numB = parseInt(b.name.match(/\d+/)?.[0] || '0');
                    return numA - numB;
                });

                const option = document.createElement('option');
                option.value = chapter;
                option.textContent = chapter.replace(/_/g, ' ');
                chapterSelect.appendChild(option);
            });

            // Charger le dernier chapitre ou le premier automatiquement
            const lastChapter = localStorage.getItem('lastChapter_' + mangaName);
            if (lastChapter && sortedChapters.includes(lastChapter)) {
                chapterSelect.value = lastChapter;
                loadChapter();
            } else if (sortedChapters.length > 0) {
                chapterSelect.value = sortedChapters[0];
                loadChapter();
            }
        }

        function loadChapter() {
            const chapterSelect = document.getElementById('chapterSelect');
            const selectedChapter = chapterSelect.value;
            
            if (!selectedChapter || !chapters[selectedChapter]) return;

            currentChapter = selectedChapter;
            const pagesContainer = document.getElementById('pagesContainer');
            pagesContainer.innerHTML = '<div class="loading">⏳ Chargement des pages...</div>';

            // Mettre à jour la dernière sélection
            document.getElementById('lastSelection').textContent = selectedChapter.replace(/_/g, ' ');
            localStorage.setItem('lastChapter_' + mangaName, selectedChapter);

            // Charger les images immédiatement
            pagesContainer.innerHTML = '';
            const pages = chapters[selectedChapter];

            pages.forEach((file, index) => {
                const img = document.createElement('img');
                img.className = 'page-image';
                img.alt = `Page ${index + 1}`;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
                
                pagesContainer.appendChild(img);
            });

            updateNavigationButtons();
        }

        function updateNavigationButtons() {
            const chapterSelect = document.getElementById('chapterSelect');
            const currentIndex = chapterSelect.selectedIndex;
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = currentIndex <= 1;
            nextBtn.disabled = currentIndex >= chapterSelect.options.length - 1 || currentIndex === 0;
        }

        function previousChapter() {
            const chapterSelect = document.getElementById('chapterSelect');
            if (chapterSelect.selectedIndex > 1) {
                chapterSelect.selectedIndex--;
                loadChapter();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextChapter() {
            const chapterSelect = document.getElementById('chapterSelect');
            if (chapterSelect.selectedIndex < chapterSelect.options.length - 1 && chapterSelect.selectedIndex !== 0) {
                chapterSelect.selectedIndex++;
                loadChapter();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function changeBackground(color, element) {
            document.querySelector('.pages-container').style.background = color;
            
            // Mettre à jour l'option active
            document.querySelectorAll('.bg-option').forEach(opt => {
                opt.classList.remove('active');
            });
            element.classList.add('active');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Charger la dernière sélection au démarrage (juste pour affichage)
        window.addEventListener('load', () => {
            const lastChapter = localStorage.getItem('lastChapter_' + mangaName);
            if (lastChapter) {
                document.getElementById('lastSelection').textContent = lastChapter.replace(/_/g, ' ');
            }
        });
    </script>
</body>
</html>
